<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Day-ahead wind forecast monitor for GB power purchasing: what was known at the auction gate, and how reliable it was." />
    <title>Wind Forecast Monitor</title>
    <script>
      // Apply the stored or system theme before first paint (no flash); lib/theme.ts takes over.
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
