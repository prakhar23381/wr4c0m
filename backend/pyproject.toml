[project]
name = "wind-forecast-backend"
version = "0.1.0"
description = "API for day-ahead wind forecast visibility and accuracy (Elexon FUELHH / WINDFOR)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
